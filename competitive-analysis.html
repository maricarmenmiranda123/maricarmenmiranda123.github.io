<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competitive Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF7F1; --surface: #FFFFFF; --surface-2: #F6F0E6; --border: #ECE2D2;
    --ink: #241F19; --ink-soft: #5C5245; --muted: #94897A;
    --accent: #5B3FF0; --accent-ink: #FFFFFF; --accent-soft: #EFEAFD; --accent-border: #D9CDFB;
    --shadow: 0 1px 2px rgba(36,31,25,.04), 0 8px 24px -12px rgba(36,31,25,.14);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #19140F; --surface: #221C15; --surface-2: #29221A; --border: #3A3124;
      --ink: #F5EFE6; --ink-soft: #CBC0AF; --muted: #948A7A; --accent: #9C82FF;
      --accent-ink: #16111F; --accent-soft: #2C2440; --accent-border: #4A3D74;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #19140F; --surface: #221C15; --surface-2: #29221A; --border: #3A3124;
    --ink: #F5EFE6; --ink-soft: #CBC0AF; --muted: #948A7A; --accent: #9C82FF;
    --accent-ink: #16111F; --accent-soft: #2C2440; --accent-border: #4A3D74;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .num, .totalnum, .claimline, .winline { font-family: "Quicksand", ui-sans-serif, system-ui, sans-serif; }

  .wrap { max-width: 900px; margin: 0 auto; padding: 48px 24px 96px; }

  h1 { font-size: clamp(28px, 4.2vw, 38px); font-weight: 700; line-height: 1.1; margin: 0; letter-spacing: -0.01em; }

  nav.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 32px 0; border-bottom: 1px solid var(--border); padding-bottom: 22px; }
  nav.tabs button {
    font-family: "Quicksand"; font-weight: 700; font-size: 14.5px; color: var(--ink-soft);
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: 9px 18px; cursor: pointer; transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  nav.tabs button:hover { border-color: var(--accent-border); color: var(--ink); }
  nav.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  nav.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .panel { display: none; }
  .panel.active { display: block; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* ---- All platforms: bento cards ---- */
  .section-head { margin: 4px 0 18px; }
  .section-head h2 { font-size: 16px; font-weight: 700; margin: 0 0 3px; }
  .section-head .sub { font-size: 13.5px; color: var(--muted); margin: 0; line-height: 1.5; }
  .how-to { margin: 0 0 4px; }
  .how-to-label { font-size: 13.5px; font-weight: 700; color: var(--ink-soft); margin: 0 0 8px; }
  .how-to ol { margin: 0; padding-left: 20px; }
  .how-to li { font-size: 13.5px; color: var(--muted); line-height: 1.55; margin-bottom: 6px; }
  .how-to li:last-child { margin-bottom: 0; }

  .bento { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 44px; }
  @media (max-width: 760px) { .bento { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 420px) { .bento { grid-template-columns: 1fr; } }
  .bcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 16px; box-shadow: var(--shadow); }
  .bcard .bname { font-family: "Quicksand"; font-weight: 700; font-size: 14px; margin-bottom: 12px; }
  .bcard .brow { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; padding: 7px 0; border-top: 1px solid var(--border); }
  .bcard .brow:first-of-type { border-top: none; }
  .bcard .brow .k { color: var(--muted); }
  .bcard .brow .v { color: var(--ink); font-weight: 600; text-align: right; }

  .bcard.hero-wide {
    grid-column: 1 / -1;
    background: var(--accent-soft); border: 1.5px solid var(--accent);
    display: flex; align-items: center; flex-wrap: wrap; gap: 22px 32px;
    padding: 18px 22px;
  }
  .bcard.hero-wide .bname { color: var(--accent); margin: 0; flex-shrink: 0; font-size: 15px; }
  .bcard.hero-wide .stats { display: flex; flex-wrap: wrap; gap: 0; flex: 1; }
  .bcard.hero-wide .stat { display: flex; flex-direction: column; gap: 3px; padding: 0 26px; border-left: 1px solid var(--accent-border); }
  .bcard.hero-wide .stat:first-child { border-left: none; padding-left: 0; }
  .bcard.hero-wide .stat .k { font-size: 11px; color: var(--ink-soft); font-weight: 600; }
  .bcard.hero-wide .stat .v { font-family: "Quicksand"; font-weight: 700; color: var(--accent); font-size: 14px; }

  /* ---- All platforms: radar ---- */
  .radar-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
  .radar-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 24px; }
  .radar-controls .ctrl-label { font-size: 12px; color: var(--muted); font-weight: 600; margin-right: 4px; }
  .radar-controls button {
    font-family: "Quicksand"; font-weight: 700; font-size: 13.5px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px;
    padding: 7px 14px; cursor: pointer; color: var(--ink-soft);
  }
  .radar-controls button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  .radar-canvas { position: relative; max-width: 420px; margin: 0 auto; }
  svg.radar-svg { display: block; width: 100%; height: auto; }
  .axis-info-btn {
    position: absolute; transform: translate(-50%, -50%);
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--accent-border); background: var(--surface); color: var(--accent);
    font-family: "Quicksand"; font-size: 12px; font-weight: 700; font-style: italic; line-height: 1;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: var(--shadow); padding: 0;
  }
  .axis-info-btn:hover, .axis-info-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .axis-info { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 18px; }
  .axis-info .placeholder { color: var(--muted); font-size: 13.5px; text-align: center; padding: 8px 0; }
  .axis-info .ai-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
  .axis-info .ai-title { font-family: "Quicksand"; font-weight: 700; font-size: 14.5px; }
  .axis-info .ai-vs { font-size: 12.5px; color: var(--muted); }
  .axis-info .ai-line { font-size: 14.5px; color: var(--ink-soft); line-height: 1.55; margin: 0 0 12px; }
  .axis-info .ai-nums { display: flex; gap: 18px; flex-wrap: wrap; }
  .axis-info .ai-num { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; font-size: 13px; }
  .axis-info .ai-num.hero { background: var(--accent-soft); border-color: var(--accent-border); }
  .axis-info .ai-num .k { color: var(--muted); display: block; font-size: 11px; margin-bottom: 2px; }
  .axis-info .ai-num .v { font-family: "Quicksand"; font-weight: 700; color: var(--ink); }
  .axis-info .ai-num.hero .v { color: var(--accent); }

  /* ---- Competitor panels ---- */
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; padding: 4px 0 32px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
  @media (max-width: 620px) { .split { grid-template-columns: 1fr; gap: 22px; } }
  .split .label { font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 10px; }
  .win { border-left: 3px solid var(--accent); padding-left: 20px; }
  .claim { padding-left: 20px; border-left: 3px solid var(--border); }
  @media (max-width: 620px) { .claim, .win { padding-left: 16px; } }
  .split ul { margin: 0; padding-left: 18px; }
  .split li { margin-bottom: 9px; line-height: 1.45; }
  .split li:last-child { margin-bottom: 0; }
  .claim li { color: var(--ink-soft); font-size: 15px; }
  .win li { color: var(--ink); font-size: 15px; font-weight: 500; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 22px; }
  .card-head { padding: 18px 22px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .card-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
  .card-head .sub { margin: 3px 0 0; font-size: 13px; color: var(--muted); }

  .calc-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-soft); white-space: nowrap; }
  .calc-row input {
    width: 64px; font-family: "Quicksand"; font-weight: 700; font-size: 14px; color: var(--accent);
    border: 1px solid var(--accent-border); background: var(--accent-soft); border-radius: 8px;
    padding: 6px 8px; text-align: center;
  }
  .calc-row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .tablewrap { overflow-x: auto; }
  table.compare { width: 100%; border-collapse: collapse; min-width: 420px; }
  table.compare th, table.compare td { padding: 13px 22px; text-align: left; font-size: 14.5px; vertical-align: top; }
  table.compare thead th { font-family: "Quicksand"; font-weight: 700; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--border); }
  table.compare thead th.us-col { color: var(--accent); }
  table.compare tbody td { border-bottom: 1px solid var(--border); color: var(--ink-soft); }
  table.compare tbody tr:last-child td { border-bottom: none; }
  table.compare .rowmain { color: var(--ink); font-weight: 500; }
  table.compare .rownote { color: var(--muted); font-size: 12px; margin-top: 3px; line-height: 1.4; }
  table.compare td.us-col { color: var(--accent); font-weight: 600; }
  table.compare tr.total td {
    font-family: "Quicksand"; font-weight: 700; font-size: 15px; color: var(--ink);
    background: var(--surface-2); border-top: 1px solid var(--border); border-bottom: none;
    padding-top: 15px; padding-bottom: 15px;
  }
  table.compare tr.total td.us-col { color: var(--accent); }

  .savings { display: inline-block; margin-left: 10px; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-border); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; font-weight: 700; font-family: "Quicksand"; vertical-align: middle; }

  .strip { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 26px 22px 6px; flex-wrap: wrap; }
  .strip .side { text-align: center; }
  .strip .side .who { font-size: 12.5px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .strip .side .totalnum { font-size: clamp(28px, 5vw, 36px); font-weight: 700; }
  .strip .side.us .totalnum { color: var(--accent); }
  .strip .vs { color: var(--muted); font-size: 13px; padding-top: 20px; }
  .unit-note { text-align: center; color: var(--muted); font-size: 12.5px; padding: 4px 22px 6px; margin: 0; }

  .divider-line { border: none; border-top: 1px solid var(--border); margin: 22px 22px 18px; }
  .leaves { padding: 0 22px 20px; }
  .leaves h3 { margin: 0 0 12px; font-size: 13.5px; font-weight: 700; color: var(--ink-soft); }
  .leaves ul { margin: 0; padding-left: 18px; }
  .leaves li { margin-bottom: 10px; font-size: 14px; line-height: 1.5; color: var(--ink-soft); }
  .leaves li:last-child { margin-bottom: 0; }
  .leaves li b { color: var(--ink); }
  .caveat { font-size: 12.5px; color: var(--muted); padding: 14px 22px 18px; margin: 0; border-top: 1px solid var(--border); }

  table.facts { width: 100%; border-collapse: collapse; }
  table.facts td { padding: 10px 22px; font-size: 13.5px; border-bottom: 1px solid var(--border); }
  table.facts tr:last-child td { border-bottom: none; }
  table.facts td:first-child { color: var(--muted); width: 34%; }
  table.facts td:nth-child(2) { color: var(--ink-soft); }
  table.facts td:nth-child(3) { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">

  <header><h1>Competitive Analysis</h1></header>

  <nav class="tabs" role="tablist" aria-label="Competitors" id="tabs"></nav>

  <div id="panels"></div>

</div>

<script>
/* ---------------- All platforms: bento cards ---------------- */
const BENTO = [
  { name: "Benable", hero: true, cost: "$50-80 / creator", managed: "Yes", guarantee: "Yes", rights: "Organic incl., ads extra", pool: "1M+" },
  { name: "JoinBrands", cost: "$25-69 / creator", managed: "Add-on", guarantee: "Refund only", rights: "Full", pool: "500K+" },
  { name: "Billo", cost: "$150-250 / video", managed: "No", guarantee: "No", rights: "Full", pool: "5K" },
  { name: "Home From College", cost: "$194 / creator", managed: "Self-serve default", guarantee: "2-strike + backfill", rights: "Full (organic+paid)", pool: "1M profiles" },
  { name: "Collabstr", cost: "$271 / creator", managed: "No", guarantee: "No", rights: "Included", pool: "100K" },
  { name: "Insense", cost: "$460 / creator", managed: "Add-on", guarantee: "No", rights: "Full", pool: "125K" },
  { name: "Social Cat", cost: "$750+ / creator", managed: "Add-on ($250/collab)", guarantee: "No", rights: "Partial (opted-in only)", pool: "90K + 500K scraped" },
];

function renderBento() {
  const hero = BENTO.find(b => b.hero);
  const rest = BENTO.filter(b => !b.hero);
  const heroHtml = `
    <div class="bcard hero-wide">
      <div class="bname">${hero.name}</div>
      <div class="stats">
        <div class="stat"><span class="k">Cost</span><span class="v">${hero.cost}</span></div>
        <div class="stat"><span class="k">Managed</span><span class="v">${hero.managed}</span></div>
        <div class="stat"><span class="k">Guarantee</span><span class="v">${hero.guarantee}</span></div>
        <div class="stat"><span class="k">Rights</span><span class="v">${hero.rights}</span></div>
        <div class="stat"><span class="k">Pool</span><span class="v">${hero.pool}</span></div>
      </div>
    </div>`;
  const restHtml = rest.map(b => `
    <div class="bcard">
      <div class="bname">${b.name}</div>
      <div class="brow"><span class="k">Cost</span><span class="v">${b.cost}</span></div>
      <div class="brow"><span class="k">Managed</span><span class="v">${b.managed}</span></div>
      <div class="brow"><span class="k">Guarantee</span><span class="v">${b.guarantee}</span></div>
      <div class="brow"><span class="k">Rights</span><span class="v">${b.rights}</span></div>
      <div class="brow"><span class="k">Pool</span><span class="v">${b.pool}</span></div>
    </div>`).join("");
  return `<div class="bento">${heroHtml}${restHtml}</div>`;
}

/* ---------------- All platforms: radar ---------------- */
const RADAR_AXES = [
  { key: "price", label: "Price" },
  { key: "management", label: "Management" },
  { key: "guarantee", label: "Guarantee" },
  { key: "rights", label: "Rights" },
  { key: "data", label: "Ad data" },
  { key: "pool", label: "Pool size" },
];

const RADAR_COMPARE = {
  price: {
    insense: { us: "$50-80 / creator", them: "$460 / creator", line: "Insense runs about $460 a creator once you add their management fee, the creator payment, and commission. Benable runs $50 to $80 a creator, cheaper at scale, because our creators are gifted, not paid." },
    billo: { us: "$50-80 / creator", them: "$150-250 / video", line: "Billo's typical video runs $150 to $200, before their $89 editing add-on. Benable runs $50 to $80 a creator, fully managed, cheaper at scale." },
    joinbrands: { us: "$4,999 / month", them: "$6,875 / month", line: "Fully managed, 100 creators a month costs $6,875 with them and $4,999 with us. On their self-serve side they can hit $25 a video, but that needs a 100-post commitment and is before their fee." },
    collabstr: { us: "$50-80 / creator", them: "$250+ / creator", line: "Even Collabstr's cheapest creators start at $250. Benable runs $50 to $80 a creator, gifted, no bidding involved." },
    socialcat: { us: "$50-80 / creator", them: "$750+ / creator, managed", line: "Their managed option runs about $750 to $800 a creator once you add the management fee and influencer budget. Their subscription tiers look cheaper on paper, $99 to $299 a month, but that's self-serve, gifted only, and capped at 30 creators total." },
    hfc: { us: "$50-80 / creator", them: "$194 / creator", line: "Their own in-feed benchmark is $150 a post plus their subscription, about $194 a creator once you add it up. Benable runs $50 to $80, though theirs bundles paid ad rights in, ours doesn't." },
  },
  management: {
    insense: { us: "Included", them: "$4,600/mo add-on", line: "Insense's managed tier is a $4,600 a month add-on. It's included with us from your first creator." },
    billo: { us: "Included", them: "Not offered", line: "Billo has no true management tier. You personally review every applicant yourself, even at their top level." },
    joinbrands: { us: "Included", them: "$4,000/mo add-on", line: "Their managed service is $4,000 a month, on top of what you pay creators. Ours is one flat, lower price." },
    collabstr: { us: "Included", them: "Not offered", line: "There's no management option at any price on Collabstr. You source, negotiate, and chase everyone yourself." },
    socialcat: { us: "Included", them: "$250/collab add-on", line: "Social Cat's management fee is $250 per collaboration, on top of the influencer budget. Benable's management is built into the price, not billed separately." },
    hfc: { us: "Included", them: "Self-serve default", line: "Home From College's standard tier is your team running the workflow end to end. Premium tiers add a specialist for advice, not full management, and their actual managed service starts at $150K. Benable's management is included at any size." },

  guarantee: {

    billo: { us: "Contract + card on file", them: "Unclear", line: "We asked Billo twice what happens when a creator misses a deadline. Both times, they dodged the question." },
    joinbrands: { us: "Contract + card on file", them: "Refund on cancel", line: "JoinBrands refunds you if a creator cancels, which is reactive. We prevent the no-show up front with a signed contract and a card on file." },
    collabstr: { us: "Contract + card on file", them: "None", line: "Collabstr has no posting guarantee at all. If a creator doesn't deliver, that's on you." },
    socialcat: { us: "Contract + card on file", them: "None", line: "Social Cat has no recourse when gifted product doesn't convert to a post. Their own words: that's the biggest problem with product seeding in general." },
    hfc: { us: "Contract + card on file", them: "2-strike policy, auto-backfill", line: "Home From College will backfill a student who misses a deadline, and restrict repeat offenders after two strikes. That's a real reliability mechanism, though it protects the workflow, not your product spend the way a card on file does." },
  },

    joinbrands: { us: "Organic incl., ads ~$25-75/video", them: "Full, included", line: "JoinBrands includes full rights, paid ads included, at every tier. We charge separately for ad usage, about $25 to $75 a video, and only once you pick the pieces you actually want to run." },
    collabstr: { us: "Organic incl., ads ~$25-75/video", them: "Included, negotiable", line: "Collabstr includes rights but leaves room for negotiated add-ons, similar in spirit to Benable. Benable's organic use is included; paid ad usage is priced per video after the fact." },
    socialcat: { us: "Organic incl., ads ~$25-75/video", them: "Guaranteed for opted-in creators only", line: "Social Cat only guarantees usage rights for their 90K opted-in creators. Their other 500K, found by scraping, may need separately negotiated rights. Benable includes organic for everyone; paid ad usage is a $25 to $75 per-video add-on." },
    hfc: { us: "Organic incl., ads ~$25-75/video", them: "Full, organic and paid, included", line: "Home From College includes paid ad rights in their base $150/post rate, no separate charge. Benable includes organic for everyone; paid ad usage is billed separately, $25 to $75 a video. This is a real edge for them." },
  },
  data: {
    insense: { us: "Not yet", them: "No", line: "Neither of us has ad-performance data tied to individual creators today." },
    billo: { us: "Not yet", them: "Yes, Meta integration", line: "This is Billo's real edge: ROAS, CTR, and hook rate per creator, benchmarked against industry medians. We don't have this yet." },
    joinbrands: { us: "Not yet", them: "No", line: "Neither platform offers this today." },
    collabstr: { us: "Not yet", them: "No", line: "Neither platform offers this today." },
    socialcat: { us: "Not yet", them: "No", line: "Neither platform offers ad-performance data tied to individual creators today." },
    hfc: { us: "Not yet", them: "Meta integration, real-time", line: "Home From College pulls in content and engagement stats in real time once a creator posts, live but recent, launched about 2 months before this call. Benable has nothing like this yet." },
  },
  pool: {
    insense: { us: "1M+", them: "125K", line: "We're about 8 times bigger, 1M+ creators to their 125K." },

const RADAR_SCORES = {
  benable:    [5, 5, 5, 3, 2, 4],
  insense:    [1, 3, 2, 5, 2, 3],
  billo:      [3, 1, 1, 5, 5, 1],
  joinbrands: [4, 3, 3, 5, 2, 5],
  collabstr:  [2, 1, 1, 4, 2, 3],
  socialcat:  [2, 3, 1, 3, 2, 4],
  hfc:        [2, 3, 3, 5, 3, 4],
};
const RADAR_NAMES = { insense: "Insense", billo: "Billo", joinbrands: "JoinBrands", collabstr: "Collabstr", socialcat: "Social Cat", hfc: "Home From College" };
const VB = 400, RCX = 200, RCY = 200, RR = 78;
let radarActive = "insense";
let radarSelectedAxis = null;

function radarPt(i, val) {
  const angle = (Math.PI * 2 * i) / RADAR_AXES.length - Math.PI / 2;
  const r = (val / 5) * RR;
  return [RCX + r * Math.cos(angle), RCY + r * Math.sin(angle), angle];
}
function radarPoly(arr) { return arr.map((v, i) => { const [x,y] = radarPt(i, v); return x+","+y; }).join(" "); }

function renderRadarSvg(activeKey) {
  let rings = "";
  for (let ring = 1; ring <= 5; ring++) {
    rings += `<polygon points="${RADAR_AXES.map((_, i) => { const [x,y]=radarPt(i, ring); return x+","+y; }).join(" ")}" fill="none" stroke="var(--border)" stroke-width="1"/>`;
  }
  let spokes = "", labels = "";
  RADAR_AXES.forEach((a, i) => {
    const [x, y, angle] = radarPt(i, 6.0);
    const [x0, y0] = radarPt(i, 0);
    const [x1, y1] = radarPt(i, 5);
    spokes += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="var(--border)" stroke-width="1"/>`;
    const cosA = Math.cos(angle);
    const anchor = cosA > 0.35 ? "start" : cosA < -0.35 ? "end" : "middle";
    const dx = anchor === "start" ? 4 : anchor === "end" ? -4 : 0;
    labels += `<text x="${x + dx}" y="${y}" font-size="12" fill="var(--muted)" font-family="Inter" text-anchor="${anchor}" dominant-baseline="middle">${a.label}</text>`;
  });
  const compShape = `<polygon points="${radarPoly(RADAR_SCORES[activeKey])}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4,3"/>`;
  const heroShape = `<polygon points="${radarPoly(RADAR_SCORES.benable)}" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2.5"/>`;
  return rings + spokes + compShape + heroShape + labels;
}

function renderAxisButtons() {
  return RADAR_AXES.map((a, i) => {
    const [x, y] = radarPt(i, 8.1);
    const leftPct = (x / VB) * 100, topPct = (y / VB) * 100;
    return `<button class="axis-info-btn" style="left:${leftPct}%; top:${topPct}%;" data-axis="${a.key}" aria-pressed="false" aria-label="${a.label}, Benable versus ${RADAR_NAMES[radarActive]}"><i>i</i></button>`;
  }).join("");
}

function renderAxisInfo() {
  if (!radarSelectedAxis) {
    return `<p class="placeholder">Tap an "i" on the chart to see Benable against ${RADAR_NAMES[radarActive]} on that one thing.</p>`;
  }
  const axis = RADAR_AXES.find(a => a.key === radarSelectedAxis);
  const c = RADAR_COMPARE[radarSelectedAxis][radarActive];
  return `
    <div class="ai-head">
      <span class="ai-title">${axis.label}</span>
      <span class="ai-vs">Benable vs ${RADAR_NAMES[radarActive]}</span>
    </div>
    <p class="ai-line">${c.line}</p>
    <div class="ai-nums">
      <div class="ai-num hero"><span class="k">Benable</span><span class="v">${c.us}</span></div>
      <div class="ai-num"><span class="k">${RADAR_NAMES[radarActive]}</span><span class="v">${c.them}</span></div>
    </div>`;
}

function refreshRadar() {
  document.getElementById("radar-svg").innerHTML = renderRadarSvg(radarActive);
  document.getElementById("axis-info").innerHTML = renderAxisInfo();
  document.querySelectorAll(".axis-info-btn").forEach(btn => {
    btn.setAttribute("aria-label", btn.dataset.axis + ", Benable versus " + RADAR_NAMES[radarActive]);
    btn.setAttribute("aria-pressed", btn.dataset.axis === radarSelectedAxis ? "true" : "false");
  });
}

function renderAllPanel() {
  return `

          <ol>
            <li>The purple shape is Benable. The closer it reaches to an edge, the better Benable does on that measure.</li>
            <li>Pick a competitor below to draw their outline, shown dashed, over it.</li>
            <li>Tap the "i" next to any label to see the real numbers behind that point.</li>
          </ol>
        </div>

      </div>

}

function initRadarControls() {
  const controls = document.getElementById("radar-controls");
  Object.keys(RADAR_NAMES).forEach(key => {
    const btn = document.createElement("button");
    btn.textContent = RADAR_NAMES[key];
    btn.setAttribute("aria-pressed", key === radarActive ? "true" : "false");
    btn.addEventListener("click", () => {
      radarActive = key;
      Array.from(controls.children).forEach(b => b.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true");
      refreshRadar();
    });
    controls.appendChild(btn);
  });
  document.querySelectorAll(".axis-info-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      radarSelectedAxis = radarSelectedAxis === btn.dataset.axis ? null : btn.dataset.axis;
      refreshRadar();
    });
  });
  refreshRadar();
}

function joinbrandsThem(N) { return 4000 + (N * 25 * 1.15); }
function joinbrandsUs(N) { return N * 49.99; }

function updateStrip(key) {
  const d = DATA[key];
  const input = document.getElementById("n-" + key);
  const N = Math.max(1, parseInt(input.value, 10) || d.defaultN);
  let them, us;
  if (d.mode === "program") {
    them = joinbrandsThem(N); us = joinbrandsUs(N);
    document.getElementById("row-videos-" + key).textContent = money(N * 25);
    document.getElementById("row-fee-" + key).textContent = money(N * 25 * 0.15);
  } else {
    them = d.themRate * N; us = d.usRate * N;
  }
  const pct = Math.round((1 - us / them) * 100);
  document.getElementById("them-total-" + key).textContent = money(them);
  document.getElementById("us-total-" + key).textContent = money(us);
  document.getElementById("badge-" + key).textContent = pct + "% less";
}

function init() {
  order.forEach((key, i) => {
    const btn = document.createElement("button");
    btn.textContent = key === "all" ? labels.all : DATA[key].name;
    btn.setAttribute("role", "tab");
    btn.setAttribute("aria-selected", i === 0 ? "true" : "false");
    btn.dataset.key = key;
    btn.addEventListener("click", () => selectTab(key));
    tabsEl.appendChild(btn);

    const panel = document.createElement("div");
    panel.className = "panel" + (i === 0 ? " active" : "");
    panel.id = "panel-" + key;
    panel.setAttribute("role", "tabpanel");

    if (key === "all") {
      panel.innerHTML = renderAllPanel();
      panelsEl.appendChild(panel);
      initRadarControls();
    } else {
      panel.innerHTML = renderPanel(key);
      panelsEl.appendChild(panel);
      document.getElementById("n-" + key).addEventListener("input", () => updateStrip(key));
      updateStrip(key);
    }
  });
}

function selectTab(key) {
  order.forEach(k => document.getElementById("panel-" + k).classList.toggle("active", k === key));
  Array.from(tabsEl.children).forEach(btn => btn.setAttribute("aria-selected", btn.dataset.key === key ? "true" : "false"));
}
